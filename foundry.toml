[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.29"
test = 'test'
auto_detect_remappings = false
auto_detect_solc = false
ignored_warnings_from = ["test/mock_fiattoken"]
optimizer = true
optimizer_runs = 150
gas_reports = ["GatewayWallet", "GatewayMinter", "UpgradeablePlaceholder"]
fs_permissions = [{ access = "read", path = "./script/compiled-contract-artifacts"}]
via_ir = false

[rpc_endpoints]
ethereum = "https://ethereum-rpc.publicnode.com"
ethereum_sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
base = "https://mainnet.base.org"
base_sepolia = "https://sepolia.base.org"
avalanche_fuji = "https://avalanche-fuji-c-chain-rpc.publicnode.com"
avalanche = "https://avalanche-c-chain-rpc.publicnode.com"
arbitrum = "https://arb1.arbitrum.io/rpc"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
optimism = "https://mainnet.optimism.io"
unichain = "https://unichain-rpc.publicnode.com"
polygon = "https://polygon-rpc.com"
world = "https://worldchain-mainnet.g.alchemy.com/public"
world_sepolia = "https://worldchain-sepolia.g.alchemy.com/public"
hyperevm = "https://rpc.hyperliquid.xyz/evm"
sonic = "https://rpc.soniclabs.com/"
arc_testnet = "https://rpc.testnet.arc.io/"

# Test profile: compile with via_ir so GatewayWallet stays under 24KB size limit
# Note: This compiles ALL contracts with via_ir (including proxies), which differs
# from production's split compilation. Deployment tests use compiled-contract-artifacts.
[profile.test]
via_ir = true
